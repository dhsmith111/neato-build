<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1080" width="700" height="1080">
  <rect width="700" height="1080" fill="#ffffff"/>
  <style>
    text { font-family: monospace; font-size: 11px; fill: #333; }
    .label { font-size: 13px; font-weight: bold; }
    .title { font-size: 16px; font-weight: bold; }
    .sub   { font-size: 11px; fill: #555; font-style: italic; }
    .dim   { font-size: 10px; fill: #555; }
    .pod-name-out { font-size: 9px; font-weight: bold; fill: #222; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- ========== TITLE ========== -->
  <text x="350" y="28" text-anchor="middle" class="title">Neato XV — Front-Mount Layout</text>
  <text x="350" y="46" text-anchor="middle" class="sub">estimates only — sensor positions illustrative until calipered</text>

  <!-- ============================================================
       TOP VIEW — large vertical room above chassis for pods + labels
       ============================================================ -->
  <text x="350" y="80" text-anchor="middle" class="label">Top View</text>
  <line x1="350" y1="100" x2="350" y2="85" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="385" y="96" class="dim">FRONT (bumper)</text>

  <!-- Pod row labels (above pods) -->
  <text x="245" y="135" text-anchor="middle" class="pod-name-out">OUTER LEFT POD</text>
  <text x="355" y="135" text-anchor="middle" class="pod-name-out">CENTER POD</text>
  <text x="470" y="135" text-anchor="middle" class="pod-name-out">INNER RIGHT POD</text>

  <!-- CAMERA POD (above and to the right of center, separate small pod) -->
  <rect x="395" y="155" width="50" height="32" rx="2" fill="#ff9800" stroke="#333" stroke-width="1.5"/>
  <text x="420" y="170" text-anchor="middle" fill="white" font-size="9">Camera</text>
  <text x="420" y="182" text-anchor="middle" fill="white" font-size="9">Module 3W</text>
  <text x="445" y="151" text-anchor="start" class="pod-name-out">CAMERA POD</text>
  <text x="445" y="163" text-anchor="start" class="dim">(lens points out of page)</text>

  <!-- ===== Pods ===== -->
  <!-- Pods drawn between y=145 and y=190; chassis bumper sits at y=205. -->

  <!-- YAHBOOM POD (outer left) -->
  <rect x="200" y="145" width="90" height="42" rx="2" fill="#e91e63" stroke="#333" stroke-width="1.5"/>
  <text x="245" y="163" text-anchor="middle" fill="white" font-size="10">Yahboom</text>
  <text x="245" y="177" text-anchor="middle" fill="white" font-size="9">PD board</text>
  <!-- KF301 (battery in) tab on outer-left edge -->
  <rect x="195" y="160" width="5" height="12" fill="#ff8f00"/>
  <!-- USB-C output on inner-right edge -->
  <rect x="290" y="163" width="5" height="6" fill="#1565c0"/>

  <!-- PI + HAT POD (center) -->
  <rect x="305" y="145" width="115" height="42" rx="2" fill="#4caf50" stroke="#333" stroke-width="1.5"/>
  <text x="362" y="163" text-anchor="middle" fill="white" font-size="10">Pi 5</text>
  <text x="362" y="177" text-anchor="middle" fill="white" font-size="9">+ AI HAT+ 2</text>
  <!-- USB-C in (left) -->
  <rect x="300" y="163" width="5" height="6" fill="#1565c0"/>
  <!-- USB-A x2 + Eth (right) -->
  <rect x="420" y="155" width="5" height="6" fill="#444"/>
  <rect x="420" y="164" width="5" height="6" fill="#444"/>
  <rect x="420" y="173" width="5" height="6" fill="#2e7d32"/>

  <!-- RELAY POD (inner right) -->
  <rect x="430" y="145" width="80" height="42" rx="2" fill="#9c27b0" stroke="#333" stroke-width="1.5"/>
  <text x="470" y="163" text-anchor="middle" fill="white" font-size="10">2-ch Relay</text>
  <text x="470" y="177" text-anchor="middle" fill="white" font-size="9">module</text>
  <!-- Control header (left, faces Pi) -->
  <rect x="425" y="163" width="5" height="8" fill="#666"/>
  <!-- Switched USB tabs (right, into chassis) -->
  <rect x="510" y="160" width="5" height="6" fill="#ff8f00"/>
  <rect x="510" y="170" width="5" height="6" fill="#ff8f00"/>

  <!-- ===== Bumper face below pods ===== -->
  <rect x="180" y="200" width="350" height="14" fill="#cccccc" stroke="#333" stroke-width="1"/>
  <text x="355" y="210" text-anchor="middle" class="dim">front bumper face (~330mm wide)</text>

  <!-- Bumper side pinch zones (avoid velcro) -->
  <rect x="180" y="200" width="22" height="14" fill="#f5b5b5"/>
  <rect x="508" y="200" width="22" height="14" fill="#f5b5b5"/>

  <!-- Right-front-corner side IR wall sensor (the ONE optic to preserve on this chassis) -->
  <!-- Drawn on the right side near the front-right corner, looking outward -->
  <circle cx="528" cy="223" r="4" fill="#e53935" stroke="#700" stroke-width="0.8"/>
  <line x1="528" y1="223" x2="555" y2="223" stroke="#e53935" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <text x="558" y="226" fill="#a00000" font-size="10">IR wall sensor (side-facing)</text>

  <!-- Cliff sensors (under chassis front edge) — placed below IR labels -->
  <circle cx="220" cy="248" r="3.5" fill="#ffffff" stroke="#0d47a1" stroke-width="1.2"/>
  <circle cx="490" cy="248" r="3.5" fill="#ffffff" stroke="#0d47a1" stroke-width="1.2"/>
  <text x="220" y="265" text-anchor="middle" class="dim" fill="#0d47a1">cliff L</text>
  <text x="490" y="265" text-anchor="middle" class="dim" fill="#0d47a1">cliff R</text>

  <!-- ===== Chassis (D-shape) ===== -->
  <path d="M 175 245 L 535 245 L 535 320 A 180 180 0 0 1 175 320 Z"
        fill="#dddddd" stroke="#333" stroke-width="2"/>

  <!-- Drive wheels -->
  <rect x="180" y="380" width="22" height="42" rx="3" fill="#555" stroke="#333" stroke-width="1"/>
  <rect x="508" y="380" width="22" height="42" rx="3" fill="#555" stroke="#333" stroke-width="1"/>
  <text x="191" y="435" text-anchor="middle" class="dim">L wheel</text>
  <text x="519" y="435" text-anchor="middle" class="dim">R wheel</text>

  <!-- LiDAR cover -->
  <circle cx="355" cy="380" r="42" fill="#bbbbbb" stroke="#555" stroke-width="1.5"/>
  <text x="355" y="384" text-anchor="middle" fill="#333" font-size="11">LiDAR</text>

  <!-- LiDAR forward arc (front half toward bumper) -->
  <path d="M 313 380 A 42 42 0 0 1 397 380"
        fill="none" stroke="#00bcd4" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="430" y="345" fill="#00bcd4" font-size="10">LiDAR forward arc</text>
  <text x="430" y="358" fill="#00bcd4" font-size="10">(must clear above pods)</text>

  <!-- Battery bays (rear quarters) -->
  <rect x="220" y="350" width="60" height="50" fill="#eef9ee" stroke="#5a8" stroke-dasharray="3,2"/>
  <text x="250" y="380" text-anchor="middle" class="dim" fill="#3a6">L battery</text>
  <rect x="430" y="350" width="60" height="50" fill="#eef9ee" stroke="#5a8" stroke-dasharray="3,2"/>
  <text x="460" y="380" text-anchor="middle" class="dim" fill="#3a6">R battery</text>

  <!-- "round edge = rear" caption -->
  <text x="355" y="495" text-anchor="middle" class="dim">round edge = rear</text>

  <!-- ===== Cable runs (top view) ===== -->
  <!-- Battery: chassis right rear → around right side → up across front → to outer-left Yahboom -->
  <path d="M 535 380 Q 560 250 560 130 Q 560 110 480 110 L 300 115 L 200 130 L 197 165"
        fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="560" y="106" text-anchor="end" fill="#c62828" font-size="10">battery 14.4V (long route)</text>
  <text x="560" y="120" text-anchor="end" fill="#c62828" font-size="9">from R-rear → R-side → front → L</text>

  <!-- Yahboom USB-C → Pi USB-C (short hop, label below pods near gap) -->
  <line x1="295" y1="166" x2="300" y2="166" stroke="#1565c0" stroke-width="1.8"/>
  <text x="298" y="143" text-anchor="middle" fill="#1565c0" font-size="9">USB-C PD</text>

  <!-- Pi USB-A → relay control (short) -->
  <line x1="425" y1="166" x2="430" y2="166" stroke="#a85000" stroke-width="1.8"/>
  <text x="427" y="143" text-anchor="middle" fill="#a85000" font-size="9">USB / GPIO</text>

  <!-- Relay switched USB → Neato internal USB port (assume left-rear of chassis) -->
  <path d="M 515 165 Q 555 250 540 350 L 280 410"
        fill="none" stroke="#ff8f00" stroke-width="1.8" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="560" y="270" text-anchor="end" fill="#ff8f00" font-size="10">USB to Neato</text>

  <!-- Camera CSI (Pi top edge → camera pod) -->
  <line x1="395" y1="155" x2="395" y2="145" stroke="#ffb300" stroke-width="1.8"/>
  <text x="395" y="200" text-anchor="middle" fill="#ffb300" font-size="9">CSI</text>

  <!-- ============================================================
       SIDE VIEW — much more horizontal room for right-side annotations
       ============================================================ -->
  <text x="350" y="555" text-anchor="middle" class="label">Side View (facing right = front)</text>

  <!-- Floor -->
  <line x1="60" y1="780" x2="640" y2="780" stroke="#333" stroke-width="1"/>
  <text x="648" y="783" class="dim">floor</text>

  <!-- Drive wheel -->
  <circle cx="280" cy="765" r="20" fill="#555" stroke="#333" stroke-width="1.5"/>

  <!-- Neato body -->
  <rect x="120" y="715" width="320" height="50" rx="6" fill="#dddddd" stroke="#333" stroke-width="2"/>
  <text x="270" y="745" text-anchor="middle" class="dim">Neato body</text>

  <!-- LiDAR cover on top -->
  <rect x="170" y="690" width="100" height="25" rx="6" fill="#bbbbbb" stroke="#555" stroke-width="1.5"/>
  <text x="220" y="706" text-anchor="middle" fill="#333" font-size="10">LiDAR dome</text>

  <!-- LiDAR forward sweep arrow -->
  <line x1="270" y1="700" x2="430" y2="700" stroke="#00bcd4" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="350" y="690" text-anchor="middle" fill="#00bcd4" font-size="10">LiDAR forward sweep</text>

  <!-- Bumper face (vertical, at front of chassis) -->
  <rect x="440" y="715" width="8" height="50" fill="#999" stroke="#333" stroke-width="1"/>
  <text x="444" y="710" text-anchor="middle" fill="#333" font-size="10">bumper</text>

  <!-- Bumper face is solid plastic — no IR through bumper face on Signature Pro.
       The single IR wall sensor is on the right-front corner (side-facing),
       not visible in this side view. -->


  <!-- Cliff sensor (under front edge of chassis) -->
  <circle cx="438" cy="765" r="3" fill="#fff" stroke="#0d47a1" stroke-width="1.2"/>

  <!-- ===== POD on front of bumper (side view), with all annotations to the RIGHT ===== -->
  <!-- Pod box -->
  <rect x="448" y="690" width="65" height="80" rx="2" fill="#4caf50" stroke="#333" stroke-width="1.5" opacity="0.92"/>
  <text x="481" y="724" text-anchor="middle" fill="white" font-size="10">Pi 5 +</text>
  <text x="481" y="738" text-anchor="middle" fill="white" font-size="10">HAT+ 2</text>
  <text x="481" y="752" text-anchor="middle" fill="white" font-size="9">(pod, side view)</text>

  <!-- Velcro band -->
  <rect x="448" y="720" width="4" height="40" fill="#ffeb3b" stroke="#a87800" stroke-width="0.7"/>

  <!-- Annotation block on the FAR RIGHT, with leader lines -->
  <!-- Top overhang -->
  <line x1="513" y1="695" x2="555" y2="610" stroke="#0d47a1" stroke-width="0.8"/>
  <text x="560" y="608" fill="#0d47a1" font-size="10">top overhang (above bumper face)</text>

  <!-- Velcro band leader -->
  <line x1="450" y1="740" x2="555" y2="635" stroke="#a87800" stroke-width="0.8"/>
  <text x="560" y="633" fill="#a87800" font-size="10">velcro band on bumper face</text>

  <!-- Bottom overhang leader -->
  <line x1="513" y1="765" x2="555" y2="660" stroke="#0d47a1" stroke-width="0.8"/>
  <text x="560" y="658" fill="#0d47a1" font-size="10">bottom overhang (below bumper face)</text>

  <!-- Bumper-face note: solid plastic, mechanically active only -->
  <line x1="444" y1="735" x2="555" y2="685" stroke="#666" stroke-width="0.8"/>
  <text x="560" y="683" fill="#444" font-size="10">bumper face (solid plastic, no IR through it)</text>

  <!-- Cliff sensor leader -->
  <line x1="438" y1="768" x2="555" y2="710" stroke="#0d47a1" stroke-width="0.8"/>
  <text x="560" y="708" fill="#0d47a1" font-size="10">cliff sensor (downward)</text>

  <!-- Bumper-depresses arrow (pod moves left when robot bumps something) -->
  <line x1="610" y1="740" x2="540" y2="740" stroke="#c62828" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="615" y="744" fill="#c62828" font-size="10">on impact: bumper + pod move backward together</text>

  <!-- Forward extension dimension (under the pod) -->
  <line x1="448" y1="790" x2="513" y2="790" stroke="#666" stroke-width="0.8"/>
  <line x1="448" y1="786" x2="448" y2="794" stroke="#666" stroke-width="0.8"/>
  <line x1="513" y1="786" x2="513" y2="794" stroke="#666" stroke-width="0.8"/>
  <text x="481" y="803" text-anchor="middle" fill="#666" font-size="10">~30-40mm forward extension</text>

  <!-- ============================================================
       LEGEND — single column, one item per row, generous spacing
       ============================================================ -->
  <text x="60" y="850" class="label">Legend</text>

  <rect x="60"  y="862" width="16" height="12" fill="#e91e63"/>
  <text x="84"  y="872" class="dim">Yahboom PD pod (outer left)</text>

  <rect x="60"  y="882" width="16" height="12" fill="#4caf50"/>
  <text x="84"  y="892" class="dim">Pi 5 + AI HAT+ 2 pod (center)</text>

  <rect x="60"  y="902" width="16" height="12" fill="#9c27b0"/>
  <text x="84"  y="912" class="dim">2-ch Relay pod (inner right)</text>

  <rect x="60"  y="922" width="16" height="12" fill="#ff9800"/>
  <text x="84"  y="932" class="dim">Camera pod (above center)</text>

  <rect x="60"  y="942" width="16" height="12" fill="#ffeb3b" stroke="#a87800"/>
  <text x="84"  y="952" class="dim">velcro band on pod's bumper-facing surface</text>

  <circle cx="68" cy="968" r="4" fill="#e53935" stroke="#700"/>
  <text x="84"  y="972" class="dim">IR wall sensor (side-facing, right-front corner) — must keep clear</text>

  <circle cx="68" cy="988" r="3.5" fill="#fff" stroke="#0d47a1" stroke-width="1.2"/>
  <text x="84"  y="992" class="dim">cliff sensor (downward, under chassis edge)</text>

  <rect x="60"  y="1002" width="16" height="12" fill="#f5b5b5"/>
  <text x="84"  y="1012" class="dim">bumper-side pinch zone — no velcro here</text>

  <line x1="60" y1="1028" x2="76" y2="1028" stroke="#00bcd4" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="84"  y="1031" class="dim">LiDAR forward arc / sweep — must clear pod tops</text>

  <line x1="60" y1="1048" x2="76" y2="1048" stroke="#c62828" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="84"  y="1051" class="dim">battery 14.4V cable</text>

  <line x1="60" y1="1068" x2="76" y2="1068" stroke="#ff8f00" stroke-width="1.8" stroke-dasharray="4,2"/>
  <text x="84"  y="1071" class="dim">USB serial (relay-switched, between Pi and Neato)</text>

  <!-- ============================================================
       NOTES — right column
       ============================================================ -->
  <text x="380" y="850" class="label">Notes</text>
  <text x="380" y="872" class="dim">• Sensor positions are illustrative.</text>
  <text x="380" y="886" class="dim">  Will be revised after caliper measurements.</text>
  <text x="380" y="908" class="dim">• Pods extend ~30-40mm forward of bumper.</text>
  <text x="380" y="922" class="dim">  Pods can also extend above and below the</text>
  <text x="380" y="936" class="dim">  bumper-face vertical band; only the velcro</text>
  <text x="380" y="950" class="dim">  band contacts the bumper face.</text>
  <text x="380" y="972" class="dim">• Bumper face has NO IR sensors looking through</text>
  <text x="380" y="986" class="dim">  it — solid plastic. Only mechanical bump</text>
  <text x="380" y="1000" class="dim">  switches. The one optic to preserve is the</text>
  <text x="380" y="1014" class="dim">  side-facing wall sensor at the right-front corner.</text>
  <text x="380" y="1036" class="dim">• Alternative layout: Yahboom OUTER RIGHT</text>
  <text x="380" y="1050" class="dim">  to shorten battery cable run (USB-C PD then</text>
  <text x="380" y="1064" class="dim">  runs longer; relay would also need to move).</text>
</svg>
